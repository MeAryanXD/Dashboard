<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeAryanXD | Secure Dashboard</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/title.jpg" type="image/jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --deep-blue: #000814;
            --purple-glow: #7F00CF;
            --text-white: #e0e1dd;
            --neon-blue: #00d2ff;
            --glass-bg: rgba(0, 0, 0, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        html { background-color: var(--deep-blue); user-select: none; /* Prevents highlighting text */ }

        body {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow-y: auto;
            background-color: transparent; 
            font-family: 'Poppins', sans-serif; 
            color: var(--text-white);
        }

        #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* --- LOCK SCREEN STYLES --- */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 8, 20, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .lock-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
            width: 300px;
        }

        .lock-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .pass-input {
            width: 80%;
            padding: 12px;
            border-radius: 50px;
            border: 2px solid #333;
            background: #000;
            color: white;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
            margin-bottom: 20px;
            transition: 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .pass-input:focus {
            border-color: var(--purple-glow);
            box-shadow: 0 0 15px var(--purple-glow);
        }

        .unlock-btn {
            padding: 10px 30px;
            border-radius: 50px;
            background: linear-gradient(45deg, #7F00CF, #00d2ff);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
        }

        .unlock-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); }

        /* Shake Animation for Wrong Password */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .shake-anim { animation: shake 0.4s ease-in-out; border-color: red !important; box-shadow: 0 0 15px red !important; }

        /* --- MAIN CONTAINER (Initially Blurred) --- */
        .container {
            position: relative; z-index: 10; width: 90%; max-width: 1200px;
            margin: 5px auto; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            opacity: 0; /* Hidden initially */
            transition: opacity 1s ease-in-out;
            padding-bottom: 50px;
            pointer-events: none; /* No clicking until unlocked */
        }

        .container.unlocked { opacity: 1; pointer-events: all; }
        .container.fade-out { opacity: 0; transform: scale(0.95); }

        /* --- TITLE --- */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem; 
            margin-bottom: 0px; 
            margin-top: 10px;
            line-height: 1.1;
            color: #A10CF7;
            text-shadow: 0 0 25px var(--purple-glow);
            letter-spacing: 2px; 
            text-align: center;
        }

        /* --- GREETING TEXT --- */
        #greeting-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem; 
            color: var(--neon-blue);
            margin-top: 5px; 
            margin-bottom: 25px; 
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            text-align: center;
        }

        /* --- CONTROL PANEL --- */
        .control-panel {
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;
            width: 100%;
            margin-bottom: 20px; 
            gap: 20px;
        }

        .left-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .right-controls {
            flex-grow: 1;
            max-width: 450px; 
            display: flex;
            justify-content: flex-end;
        }

        /* --- SEARCH BOX --- */
        .search-box {
            background: var(--glass-bg);
            border: 2px solid var(--neon-blue);
            color: white;
            border-radius: 50px;
            padding: 15px 20px;
            width: 300px;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .search-box:focus {
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            background: rgba(0, 0, 0, 0.8);
        }

        .search-btn {
            padding: 15px 25px;
            border-radius: 50px;
            background: linear-gradient(45deg, #0000ff, #00d2ff);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            white-space: nowrap;
        }
        .search-btn:hover { transform: scale(1.05); }

        /* --- CLOCK WIDGET --- */
        .clock-widget {
            background: rgba(255, 255, 255, 0.9);
            color: #0000aa;
            padding: 5px 15px;
            border-radius: 15px;
            border: 2px solid blue;
            text-align: center;
            min-width: 160px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            height: 50px; 
        }

        .time { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
        .date { font-size: 0.7rem; font-weight: 600; color: #333; }

        /* --- QUICK NOTES --- */
        #quick-note {
            width: 100%;
            height: 60px; 
            background: var(--glass-bg);
            border: var(--glass-border);
            color: white;
            padding: 15px;
            border-radius: 20px;
            resize: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            font-size: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s;
        }
        #quick-note:focus { border-color: var(--neon-blue); outline: none; }

        /* --- GRID MENU --- */
        .grid-menu { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 30px; 
            width: 100%; 
            justify-items: center; 
        }

        /* --- CARD STYLE --- */
        .card {
            background: var(--glass-bg); 
            border: var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            width: 220px; 
            height: 140px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-decoration: none; color: var(--text-white);
            transition: all 0.3s ease; cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.03); 
            border-color: var(--purple-glow);
            box-shadow: 0 0 25px rgba(127, 0, 207, 0.4); 
            background: rgba(127, 0, 207, 0.15); 
        }

        .card-img {
            width: 65px; height: 65px; object-fit: contain; margin-bottom: 10px;
            filter: drop-shadow(0 0 5px rgba(127, 0, 207, 0.5));
        }

        .label { 
            font-size: 1.3rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 1000px) {
            .control-panel {
                flex-direction: column;
                align-items: center;
            }
            .left-controls, .right-controls {
                width: 100%;
                justify-content: center;
                max-width: none;
            }
            #quick-note { width: 90%; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; margin-bottom: 5px; }
            #greeting-text { font-size: 1.1rem; margin-bottom: 20px; }
            .grid-menu { grid-template-columns: repeat(2, 1fr); gap: 15px; } 
            .card { width: 100%; max-width: 200px; height: 130px; } 
            .card-img { width: 50px; height: 50px; }
            .label { font-size: 1rem; }
            .search-box { width: 200px; }
            #lock-screen { z-index: 99999; }
        }

        @media (max-width: 400px) {
            h1 { font-size: 2rem; }
            .grid-menu { gap: 10px; }
            .card { height: 120px; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div id="lock-screen">
        <div class="lock-container">
            <div class="lock-title">System Locked</div>
            <input type="password" id="passwordInput" class="pass-input" placeholder="Enter Access Code">
            <br>
            <button onclick="checkPassword()" class="unlock-btn">UNLOCK</button>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <h1>MeAryanXD</h1>
        <div id="greeting-text">Loading System...</div>

        <div class="control-panel">
            <div class="left-controls">
                <form action="https://www.google.com/search" method="GET" target="_blank" style="display:flex; gap:10px; align-items:center;" onsubmit="setTimeout(() => this.reset(), 100);">
                    <input type="text" name="q" class="search-box" placeholder="Search...">
                    <button type="submit" class="search-btn">Explore!!</button>
                </form>

                <div class="clock-widget">
                    <div class="time" id="digital-clock">Loading...</div>
                    <div class="date" id="date-display">...</div>
                </div>
            </div>

            <div class="right-controls">
                <textarea id="quick-note" placeholder="Quick Notes... (Syncs to Cloud)"></textarea>
            </div>
        </div>

        <div class="grid-menu">
            <a href="music.html" class="card" onclick="transitionToPage(event, 'music.html')">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/music.png" class="card-img" alt="Music">
                <div class="label">Music</div>
            </a>

            <a href="https://open.spotify.com" target="_blank" class="card">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/spotify.png" class="card-img" alt="Spotify">
                <div class="label">Spotify</div>
            </a>

            <a href="https://discord.com/app" target="_blank" class="card">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/discord-2.png" class="card-img" alt="Discord">
                <div class="label">Discord</div>
            </a>

            <a href="https://github.com/MeAryanXD" target="_blank" class="card">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/git%20hub.png" class="card-img" alt="GitHub">
                <div class="label">GitHub</div>
            </a>

            <a href="https://www.youtube.com" target="_blank" class="card">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/yt.png" class="card-img" alt="YouTube">
                <div class="label">YouTube</div>
            </a>

            <a href="https://www.instagram.com" target="_blank" class="card">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/instagram.png" class="card-img" alt="Instagram">
                <div class="label">Instagram</div>
            </a>

            <a href="https://outlook.live.com" target="_blank" class="card">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/outlook.png" class="card-img" alt="Outlook">
                <div class="label">Outlook</div>
            </a>

            <a href="https://chatgpt.com" target="_blank" class="card">
                <img src="https://raw.githubusercontent.com/MeAryanXD/Dashboard/refs/heads/main/icons/chat-gpt.png" class="card-img" alt="Chat GPT">
                <div class="label">Chat GPT</div>
            </a>

        </div>
    </div>

    <script>
        // --- SECURITY: ANTI INSPECT & RIGHT CLICK ---
        // 1. Disable Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Disable Keyboard Shortcuts (F12, Ctrl+Shift+I, etc.)
        document.onkeydown = function(e) {
            // F12
            if(e.keyCode == 123) return false;
            // Ctrl+Shift+I (Inspect)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            // Ctrl+Shift+C (Inspect Element)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            // Ctrl+Shift+J (Console)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            // Ctrl+U (View Source)
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        };

        // --- PASSWORD SYSTEM ---
        const myPassword = "Aryan9117"; // <--- CHANGE YOUR PASSWORD HERE
        const passwordInput = document.getElementById('passwordInput');

        // Allow pressing "Enter" to unlock
        passwordInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") checkPassword();
        });

        function checkPassword() {
            const val = passwordInput.value;
            const screen = document.getElementById('lock-screen');
            const main = document.getElementById('mainContainer');

            if(val === myPassword) {
                // Correct Password
                screen.style.opacity = '0';
                screen.style.pointerEvents = 'none';
                setTimeout(() => { screen.style.display = 'none'; }, 800);
                
                // Show Main Content
                main.classList.add('unlocked');
            } else {
                // Wrong Password - Trigger Shake
                passwordInput.classList.add('shake-anim');
                passwordInput.value = ''; // Clear input
                setTimeout(() => {
                    passwordInput.classList.remove('shake-anim');
                }, 400);
            }
        }

        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAt2zYFeF_1Y7-Dt6T_DatnKQch4miGGM4",
            authDomain: "dashboard-2e1a8.firebaseapp.com",
            projectId: "dashboard-2e1a8",
            storageBucket: "dashboard-2e1a8.firebasestorage.app",
            messagingSenderId: "260462525679",
            appId: "1:260462525679:web:27f7c53c79f66c6d3d2f1a",
            databaseURL: "https://dashboard-2e1a8-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const noteRef = db.ref('quick_notes/meAryanXD_note');

        // --- 2. TRANSITION LOGIC ---
        function transitionToPage(event, url) {
            event.preventDefault(); 
            const container = document.getElementById('mainContainer');
            container.classList.add('fade-out'); 
            setTimeout(() => { window.location.href = url; }, 500); 
        }

        // --- 3. STARFIELD ANIMATION ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let w, h;

        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const numStars = 1000;
        const stars = [];
        for (let i = 0; i < numStars; i++) {
            stars.push({ x: Math.random() * w - w / 2, y: Math.random() * h - h / 2, z: Math.random() * w });
        }

        function animate() {
            ctx.fillStyle = "#000814";
            ctx.fillRect(0, 0, w, h);
            const cx = w / 2; const cy = h / 2;
            ctx.fillStyle = "white";
            stars.forEach(star => {
                star.z -= 2; 
                if (star.z <= 0) { star.z = w; star.x = Math.random() * w - w / 2; star.y = Math.random() * h - h / 2; }
                const x = (star.x * (w / star.z)) + cx;
                const y = (star.y * (w / star.z)) + cy;
                const size = (1 - star.z / w) * 2.5; 
                if (x > 0 && x < w && y > 0 && y < h) { ctx.beginPath(); ctx.arc(x, y, size > 0 ? size : 0, 0, Math.PI * 2); ctx.fill(); }
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 4. CLOCK & GREETING LOGIC ---
        function updateClock() {
            const now = new Date();
            document.getElementById('digital-clock').innerHTML = now.toLocaleTimeString('en-US', {
                timeZone: 'Asia/Kolkata', hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-display').innerHTML = now.toLocaleDateString('en-IN', options);

            const hour = now.getHours();
            let greetingText = "Welcome Back, Aryan.";
            if (hour >= 5 && hour < 12) greetingText = "Good Morning, Aryan. Ready to grind?";
            else if (hour >= 12 && hour < 17) greetingText = "Good Afternoon, Aryan. Keep it up!";
            else if (hour >= 17 && hour < 22) greetingText = "Good Evening, Aryan. Time to chill?";
            else greetingText = "Late Night Session, Aryan? Eyes on the prize.";
            
            const greetingEl = document.getElementById('greeting-text');
            if (greetingEl.innerHTML !== greetingText) greetingEl.innerHTML = greetingText;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 5. FIREBASE SYNC LOGIC ---
        const noteArea = document.getElementById('quick-note');
        let debounceTimer;

        noteRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data !== null && document.activeElement !== noteArea) {
                noteArea.value = data;
            }
        });

        noteArea.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                noteRef.set(noteArea.value);
            }, 1000); 
        });
    </script>
</body>
</html>
